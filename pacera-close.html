<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pacera Close</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet"><style>/* ===== Pacera design tokens ===== */
:root{
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* Brand */
  --midnight:#221133; --amethyst:#6200B3; --indigo:#574AE2; --flame:#CF24FF; --eggshell:#38C9D6;
  /* Data-origin identity (measured: all >=4.5:1 on their surfaces, >=13 dE between pairs under CVD simulation) */
  --blue:#1F5BFF; --blue-ink:#1A47C9; --blue-bg:#E8EEFF; --blue-line:#B8C9FF;
  --turq:#0B7A82; --turq-ink:#0A6E78; --turq-bg:#DFF3F4; --turq-line:#A6DADD;
  --purple:#6200B3; --purple-ink:#6200B3; --purple-bg:#F1E8FA; --purple-line:#D6BBF0;
  /* Surfaces & text */
  --bg:#F6F5FA; --surface:#FFFFFF; --surface-2:#F0EEF7; --surface-3:#E7E4F1;
  --border:#E2DFEE; --border-strong:#C9C4DD;
  --text:#1B1030; --text-2:#4A4363; --text-3:#675F82; --on-accent:#FFFFFF;
  --header:#221133; --header-2:#2D1A45; --header-text:#FFFFFF; --header-text-2:#C9BEDF;
  /* Status */
  --ok:#1E7A34; --ok-bg:#E4F4E8; --warn:#A65A00; --warn-bg:#FFF1DC; --bad:#C42B2B; --bad-bg:#FDE8E8; --neutral-bg:#ECE9F4;
  /* Chart categorical (excludes turquoise + purple, reserved for provenance) */
  --c1:#1F5BFF; --c2:#D97706; --c3:#D6336C; --c4:#5C6B8A; --c5:#221133; --c6:#7FA3FF;
  --seq-1:#EAF0FF; --seq-2:#C7D6FF; --seq-3:#93AEFF; --seq-4:#5B82FF; --seq-5:#1F5BFF; --seq-6:#1138B8;
  /* Accent switches per application */
  --accent:var(--blue); --accent-ink:var(--blue-ink); --accent-bg:var(--blue-bg); --accent-line:var(--blue-line);
  --shadow-1:0 1px 2px rgba(34,17,51,.06),0 1px 1px rgba(34,17,51,.04);
  --shadow-2:0 8px 24px rgba(34,17,51,.14),0 2px 6px rgba(34,17,51,.08);
  --r-1:4px; --r-2:8px; --r-3:12px;
  --focus:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
}
:root[data-theme="dark"]{
  --blue:#8AA8FF; --blue-ink:#AFC3FF; --blue-bg:rgba(138,168,255,.14); --blue-line:rgba(138,168,255,.38);
  --turq:#35D0DB; --turq-ink:#6FE0EA; --turq-bg:rgba(53,208,219,.13); --turq-line:rgba(53,208,219,.38);
  --purple:#A560FF; --purple-ink:#C9A0FF; --purple-bg:rgba(165,96,255,.16); --purple-line:rgba(165,96,255,.42);
  --bg:#120A1F; --surface:#1A0F2B; --surface-2:#231538; --surface-3:#2D1C47;
  --border:#35244F; --border-strong:#4C386D;
  --text:#F3EFFA; --text-2:#C2B9DB; --text-3:#9D93BA; --on-accent:#0B1020;
  --header:#0E0618; --header-2:#1A0F2B; --header-text:#FFFFFF; --header-text-2:#B5A9D2;
  --ok:#5FD07A; --ok-bg:rgba(95,208,122,.13); --warn:#F0A53C; --warn-bg:rgba(240,165,60,.14); --bad:#FF7A7A; --bad-bg:rgba(255,122,122,.14); --neutral-bg:#2D1C47;
  --c1:#8AA8FF; --c2:#F0A53C; --c3:#FF8FB8; --c4:#9FB0D0; --c5:#F3EFFA; --c6:#5B82FF;
  --seq-1:#1E2A5C; --seq-2:#2A3F8F; --seq-3:#3F5FD0; --seq-4:#5F82FF; --seq-5:#8AA8FF; --seq-6:#C0D0FF;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px rgba(0,0,0,.5);
}
body.app-launchpad{--accent:var(--purple);--accent-ink:var(--purple-ink);--accent-bg:var(--purple-bg);--accent-line:var(--purple-line)}
/* Data provenance: where a number came from */
.src-app{--src:var(--blue);--src-ink:var(--blue-ink);--src-bg:var(--blue-bg);--src-line:var(--blue-line)}
.src-ora{--src:var(--turq);--src-ink:var(--turq-ink);--src-bg:var(--turq-bg);--src-line:var(--turq-line)}
.src-suite{--src:var(--purple);--src-ink:var(--purple-ink);--src-bg:var(--purple-bg);--src-line:var(--purple-line)}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-1)}
svg.ic{display:inline-block;flex:none;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

/* ===== shell grid ===== */
.shell{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr) 28px;min-width:0}
.hdr{background:var(--header);color:var(--header-text);display:flex;align-items:flex-end;min-width:0;position:relative;z-index:5}
.hdr .cell{width:48px;height:48px;display:grid;place-items:center;flex:none;color:var(--header-text)}
.hdr .app-btn{background:var(--accent);color:var(--on-accent);position:relative}
body.app-launchpad .hdr .app-btn{background:var(--purple);color:#fff}
.hdr .app-btn:hover{filter:brightness(1.1)}
.hdr .home-btn{color:var(--header-text-2)}
.hdr .home-btn:hover,.hdr .home-btn.on{background:var(--header-2);color:#fff}
.hdr .home-btn.on{box-shadow:inset 0 -2px 0 var(--accent)}
body.app-launchpad .hdr .home-btn.on{box-shadow:inset 0 -2px 0 var(--purple-ink)}
.tabs{display:flex;align-items:flex-end;gap:2px;height:48px;padding:0 8px 0 8px;overflow:hidden;min-width:0;flex:1}
.tab{height:34px;max-width:200px;min-width:96px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:var(--r-2) var(--r-2) 0 0;color:var(--header-text-2);font-size:12px;white-space:nowrap;cursor:pointer;flex:0 1 auto;position:relative}
.tab:hover{background:var(--header-2);color:#fff}
.tab.on{background:var(--bg);color:var(--text)}
.tab .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;opacity:.7}
.tab .x:hover{background:rgba(127,127,160,.25);opacity:1}
.tab .src-dot{width:6px;height:6px;border-radius:50%;background:var(--src);flex:none}
.hdr-right{display:flex;align-items:center;gap:2px;padding:0 8px;height:48px;flex:none}
.hbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-2);color:var(--header-text-2);position:relative}
.hbtn:hover{background:var(--header-2);color:#fff}
.hbtn .badge{position:absolute;top:3px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--bad);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px;font-weight:600}
.hbtn.ora{color:#35D0DB}
.hsearch{display:flex;align-items:center;gap:8px;height:30px;width:220px;padding:0 10px;border-radius:var(--r-2);background:var(--header-2);color:var(--header-text-2);font-size:12px;border:1px solid rgba(255,255,255,.08);margin-right:6px}
.hsearch kbd{margin-left:auto;font:inherit;font-size:10px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:0 5px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--flame));color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.body{display:flex;min-height:0;min-width:0;position:relative}
.rail{width:48px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px}
.rail.right{border-right:0;border-left:1px solid var(--border)}
.rail .sp{flex:1}
.rail .sep{width:24px;height:1px;background:var(--border);margin:4px 0}
.rbtn{width:48px;height:44px;display:grid;place-items:center;color:var(--text-2);position:relative;flex:none}
.rbtn:hover{background:var(--surface-2);color:var(--text)}
.rbtn.on{color:var(--accent-ink);background:var(--accent-bg)}
.rbtn.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail.right .rbtn.on::before{left:auto;right:0;border-radius:3px 0 0 3px}
.rail.right .rbtn.ora.on{color:var(--turq-ink);background:var(--turq-bg)}
.rail.right .rbtn.ora.on::before{background:var(--turq)}
.rbtn.ora{color:var(--turq-ink)}
.rbtn .pip{position:absolute;top:9px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--turq);box-shadow:0 0 0 2px var(--surface)}
.rbtn[data-tip]:hover::after,.cell[data-tip]:hover::after,.hbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);background:var(--header);color:#fff;font-size:11px;padding:4px 8px;border-radius:var(--r-1);white-space:nowrap;z-index:60;pointer-events:none;box-shadow:var(--shadow-2)}
.rail.right .rbtn[data-tip]:hover::after{left:auto;right:calc(100% + 6px)}
.hbtn[data-tip]:hover::after,.cell[data-tip]:hover::after{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
/* suite switcher rail: slides in and pushes main rail */
.suite{width:0;overflow:hidden;background:var(--header);flex:none;transition:width .18s ease;display:flex;flex-direction:column;align-items:center}
.suite.open{width:48px}
.suite .rbtn{color:var(--header-text-2);width:48px}
.suite .rbtn:hover{background:var(--header-2);color:#fff}
.suite .rbtn.cur{color:#fff;background:var(--header-2)}
.suite .rbtn.cur::before{background:#fff}
.suite .lbl{font-size:9px;color:var(--header-text-2);padding:8px 0 4px;letter-spacing:.08em}
.suite .tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff}
.suite .tile.lp{background:var(--purple)} .suite .tile.ap{background:var(--blue)}
:root[data-theme="dark"] .suite .tile.ap{color:#0B1020}
.suite .rbtn.cur::before{left:0}
/* level-2 panel */
.l2{width:0;overflow:hidden;flex:none;background:var(--surface);border-right:1px solid var(--border);transition:width .16s ease}
.l2.open{width:248px}
.l2 .in{width:248px;height:100%;display:flex;flex-direction:column}
.l2 .ph{height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);flex:none}
.l2 .ph .ico{width:32px;height:32px;border-radius:var(--r-2);background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center}
.l2 .ph h2{font-size:14px;font-weight:600;margin:0;flex:1;white-space:nowrap}
.l2 .flt{margin:10px 12px 4px;display:flex;align-items:center;gap:8px;height:30px;border:1px solid var(--border);border-radius:var(--r-2);padding:0 8px;color:var(--text-3);background:var(--bg)}
.l2 .flt input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12px}
.l2 .list{overflow:auto;padding:4px 8px 12px;flex:1}
.l2 .grp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:12px 8px 4px;font-weight:600}
.mi{width:100%;height:32px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:var(--r-1);color:var(--text-2);text-align:left;font-size:13px}
.mi:hover{background:var(--surface-2);color:var(--text)}
.mi.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:500}
.mi .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .chev{transition:transform .12s}
.mi.open .chev{transform:rotate(90deg)}
.mi .tag{font-size:10px;padding:0 6px;border-radius:8px;background:var(--surface-3);color:var(--text-2);line-height:16px}
.l3{margin:2px 0 4px 18px;padding-left:10px;border-left:1px solid var(--border);display:none}
.l3.open{display:block}
.l3 .mi{height:28px;font-size:12px;padding-left:6px}
.ws{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ws-scroll{flex:1;overflow:auto;position:relative}
.ws-scroll{container-type:inline-size;container-name:ws}.ws-inner{padding:20px 24px 40px;min-width:0}
.rp{width:0;overflow:hidden;flex:none;background:var(--surface);border-left:1px solid var(--border);transition:width .16s ease}
.rp.open{width:380px}
.rp .in{width:380px;height:100%;display:flex;flex-direction:column}
.rp .ph{height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);flex:none}
.rp .ph h2{font-size:14px;font-weight:600;margin:0;flex:1}
.rp.ora .ph{background:var(--turq-bg)}
.rp.ora .ph .ico{color:var(--turq-ink)}
.ftr{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:0;font-size:11px;color:var(--text-2);padding:0 8px 0 0;min-width:0}
.ftr .it{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;border-right:1px solid var(--border);white-space:nowrap}
.ftr .it:hover{background:var(--surface-2)}
.ftr .sp{flex:1}
.ftr .dotg{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ftr .zoom{display:flex;align-items:center;gap:2px}
.ftr .zb{width:22px;height:22px;display:grid;place-items:center;border-radius:4px}
.ftr .zb:hover{background:var(--surface-3)}
.ftr input[type=range]{width:90px;accent-color:var(--accent)}
/* ===== page + components ===== */
.pghead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.pghead .ttl{flex:1;min-width:260px}
.crumb{font-size:11px;color:var(--text-3);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.pghead h1{font-size:20px;font-weight:600;margin:0;line-height:1.3;display:flex;align-items:center;gap:10px}
.pghead p{margin:2px 0 0;color:var(--text-2);font-size:12.5px;max-width:720px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:var(--r-2);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body.app-launchpad .btn.pri{color:#fff;background:var(--purple);border-color:var(--purple)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ora{background:var(--turq);border-color:var(--turq);color:#fff}
:root[data-theme="dark"] .btn.ora{color:#04202A}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}.btn.sm.icon{width:26px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-2);overflow:hidden;background:var(--surface)}
.seg button{height:30px;padding:0 12px;font-size:12px;color:var(--text-2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
@container ws (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container ws (max-width:760px){.g4,.g3,.g2,.g21,.g12,.g32,.g23{grid-template-columns:minmax(0,1fr)}}
@container ws (max-width:1000px){.g21,.g12,.g32,.g23{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);box-shadow:var(--shadow-1);min-width:0;position:relative}
.card[class*="src-"]{border-left:3px solid var(--src)}
.card .ch{display:flex;align-items:center;gap:8px;padding:12px 16px 0;min-height:40px}
.card .ch h3{font-size:13px;font-weight:600;margin:0;flex:1}
.card .cb{padding:12px 16px 16px}
.card .cb.flush{padding:0}
.card .sub{font-size:11.5px;color:var(--text-3);padding:0 16px}
.pv{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 5px;border-radius:10px;font-size:10.5px;font-weight:500;background:var(--src-bg);color:var(--src-ink);border:1px solid var(--src-line);white-space:nowrap}
.pv.sm{height:18px;font-size:10px}
.pvs{display:inline-flex;gap:4px}
.badge-s{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--neutral-bg);color:var(--text-2);white-space:nowrap}
.badge-s.ok{background:var(--ok-bg);color:var(--ok)}.badge-s.warn{background:var(--warn-bg);color:var(--warn)}.badge-s.bad{background:var(--bad-bg);color:var(--bad)}.badge-s.blue{background:var(--blue-bg);color:var(--blue-ink)}.badge-s.turq{background:var(--turq-bg);color:var(--turq-ink)}.badge-s.purple{background:var(--purple-bg);color:var(--purple-ink)}
.kpi{padding:14px 16px}
.kpi{container-type:inline-size}.kpi .lb{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:4px;white-space:nowrap}.kpi .lb .sp{flex:1;min-width:4px}.kpi .d{flex-wrap:wrap}@container (max-width:230px){.kpi .lb .pv{display:none}}
.kpi .lb .sp{flex:1}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text-3);margin-left:3px}
.kpi .d{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:4px;color:var(--text-2)}
.d .up{color:var(--ok)}.d .dn{color:var(--bad)}
.kpi .sp-wrap{height:30px;margin-top:6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;color:var(--text-2);padding:0 12px;height:32px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:0 12px;height:36px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.tbl tr.tot td{font-weight:600;background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-bg)}
.tbl .ind1{padding-left:28px}.tbl .ind2{padding-left:44px}
.tbl .ex{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:6px;border-radius:4px;color:var(--text-2)}
.tbl .ex:hover{background:var(--surface-3)}
.tbl .neg{color:var(--bad)}.tbl .pos{color:var(--ok)}
.tblwrap{overflow:auto;max-height:560px;border-radius:0 0 var(--r-3) var(--r-3)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.turq i{background:var(--turq)}.bar.purple i{background:var(--purple)}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:10.5px;fill:var(--text-3)}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart .ax{stroke:var(--border-strong);stroke-width:1}
